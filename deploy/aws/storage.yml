AWSTemplateFormatVersion: "2010-09-09"
Description: FDX encrypted S3 storage with lifecycle archival and an EC2 application role

Parameters:
  ArchiveAfterDays:
    Type: Number
    Default: 90
    MinValue: 30
  DeleteAfterDays:
    Type: Number
    Default: 365
    MinValue: 90

Resources:
  FdxMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveAndExpireEventMedia
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: !Ref ArchiveAfterDays
            ExpirationInDays: !Ref DeleteAfterDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  FdxApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: FdxStorageAndEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${FdxMediaBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt FdxMediaBucket.Arn
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: "*"

  FdxInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref FdxApplicationRole]

Outputs:
  BucketName:
    Value: !Ref FdxMediaBucket
  InstanceProfileName:
    Value: !Ref FdxInstanceProfile
