limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream fdx_api { server api:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10g;
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://fdx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v2/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://fdx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Local object uploads are already bounded by the browser's upload worker
    # pool. Applying the ordinary request-rate limit here rejects batches of
    # small photos even though only a handful of transfers run concurrently.
    # Production S3 uploads bypass this proxy through presigned URLs.
    location ~ ^/api/v2/events/[^/]+/upload-batches/[^/]+/objects/[^/]+$ {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://fdx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://fdx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        proxy_pass http://fdx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
    }
}
