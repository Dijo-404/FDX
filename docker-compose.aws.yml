name: fdx-production

x-api-environment: &api_environment
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_SECURITY_PROTOCOL: SSL
  ML_SERVICE_URL: http://ml:3000
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET}
  AWS_REGION: ${AWS_REGION}
  JWT_SECRET: ${JWT_SECRET}
  FRONTEND_URL: ${FRONTEND_URL}
  FDX_ENVIRONMENT: production
  FDX_SUPER_ADMIN_EMAIL: ${FDX_SUPER_ADMIN_EMAIL}
  FDX_SUPER_ADMIN_PASSWORD: ${FDX_SUPER_ADMIN_PASSWORD}
  EMAIL_PROVIDER: ses
  EMAIL_FROM: ${EMAIL_FROM}
  EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET}
  RETENTION_SCHEDULER_ENABLED: "false"

services:
  ml:
    image: ${ML_IMAGE}
    environment:
      FDX_DEVICE: ${FDX_DEVICE:-cpu}
      ML_WARMUP_ON_IMPORT: "1"
    volumes:
      - /opt/fdx/face-processing/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthcheck', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    environment: *api_environment
    depends_on:
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: ${API_IMAGE}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api_environment
      RUN_MIGRATIONS: "false"
    depends_on:
      api: { condition: service_healthy }
      ml: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
